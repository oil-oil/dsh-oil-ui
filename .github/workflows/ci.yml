name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dsh: ['0.2.1-rc.2', '0.2.1-rc.3', '0.2.1-rc.4', '0.2.1-rc.5', '0.2.2-rc.1']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Test against supported DSH dependency versions
        if: matrix.dsh != '0.2.2-rc.1'
        shell: bash
        run: |
          cordis_version=4.1.0
          if [[ "${{ matrix.dsh }}" == 0.2.1-* ]]; then
            cordis_version=4.0.5
          fi
          pnpm add -D --save-exact "@deepseek-ai/cordis@${cordis_version}"
          packages=(dsh-agent dsh-fs dsh-llm dsh-ptc-runtime dsh-sandbox dsh-sandbox-policy dsh-scope dsh-session dsh-session-projection dsh-skill dsh-system-prompt dsh-tools dsh-user-approval dsh-working-directory)
          for package in "${packages[@]}"; do
            pnpm add -D --save-exact "@deepseek-ai/${package}@${{ matrix.dsh }}"
          done
      - run: pnpm check
      - run: pnpm pack:plugin
      - name: Restore manifests after the matrix run
        if: matrix.dsh != '0.2.2-rc.1'
        run: git checkout -- package.json pnpm-lock.yaml
      - name: Verify validation leaves the checkout unchanged
        run: git diff --exit-code

  install-smoke:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        profile: [web, headless]
        dsh:
          - version: '0.2.1-rc.5'
            node: '22'
          - version: '0.2.2-rc.1'
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.dsh.node }}
      - name: Install project dependencies with temporary pnpm
        run: npm exec --yes --package=pnpm@10.16.1 -- pnpm install --frozen-lockfile
      - name: Verify cross-platform CLI launch helpers
        run: npm test -- tests/portable-cli.test.ts
      - name: Install the current plugin archive into isolated DSH and smoke the Host
        env:
          DSH_SMOKE_PROFILE: ${{ matrix.profile }}
        run: npm run smoke:install -- --dsh-version ${{ matrix.dsh.version }}
      - name: Verify the install smoke leaves the checkout unchanged
        run: git diff --exit-code
